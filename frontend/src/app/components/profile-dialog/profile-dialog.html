<h2 mat-dialog-title>Profil</h2>
<mat-dialog-content>
  <p><strong>Kullanıcı adı:</strong> {{ displayName }}</p>
  <p class="note">Fotoğraf, e-posta ve şifre güncelleme özellikleri yakında eklenecek.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Kapat</button>
</mat-dialog-actions>
